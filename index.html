
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dashboard</title>

    <link rel="stylesheet" href="css/magic-eight-ball.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.5;
            background: #f5f7fa;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
        }

        .col {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #goal-message,
        #conversion-result {
            margin-top: 20px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        /* M7 Task Manager */
        #task-list {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
        }

        #task-list h3 {
            margin-bottom: 10px;
        }

        #user-tasks {
            padding-left: 25px;
        }

        #user-tasks li {
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        #user-tasks button {
            margin-left: 10px;
            padding: 5px 8px;
        }

        /* Magic Eight Ball */
        #magic-eight-ball {
            text-align: center;
        }

        #magicEightBall {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        #ball {
            width: 220px;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        #circle {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                margin: 10px;
            }

            .col {
                max-width: 100%;
            }

            #ball {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <h1>Dashboard Status</h1>

    <main class="row">

        <!-- WEEKLY TASK GOALS AND M7 TASK MANAGER -->
        <section class="col" id="weekly-tasks">

            <h2>Weekly Task Goals</h2>

            <form id="goal-form">
                <label for="user-name">Name:</label>
                <input type="text" id="user-name" required>

                <label for="daily-goal">Daily Task Goal:</label>
                <input type="number" id="daily-goal"
                       min="0" step="1" required>

                <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                <input type="number" id="bonus-tasks"
                       min="0" step="1" required>

                <button type="submit" id="goal-btn">
                    Calculate Weekly Goal
                </button>
            </form>

            <p id="goal-message" aria-live="polite"></p>

            <!-- M7 REQUIRED TASK MANAGER INTERFACE -->
            <div id="task-list">

                <h3>Weekly Task List</h3>

                <p>Enter a task below to manage your goals.</p>

                <form id="task-form">
                    <label for="task-name">Enter task:</label>

                    <input
                        type="text"
                        id="task-name"
                        name="task-name"
                    >

                    <button type="submit" id="add-task">
                        Add Task
                    </button>
                </form>

                <!-- JavaScript creates the UL here. -->

            </div>
        </section>

        <!-- IMPERIAL / METRIC CONVERTER -->
        <section class="col" id="metric-converter">

            <h2>Imperial/Metric Converter</h2>

            <form id="converter-form">

                <label for="input-value">Enter a value:</label>

                <input
                    type="number"
                    id="input-value"
                    step="any"
                    required
                >

                <label for="conversion-type">
                    Choose a conversion:
                </label>

                <select id="conversion-type">
                    <option value="inch-to-centimeter">
                        Inch to Centimeter
                    </option>

                    <option value="foot-to-centimeter">
                        Foot to Centimeter
                    </option>

                    <option value="yard-to-meter">
                        Yard to Meter
                    </option>

                    <option value="mile-to-kilometer">
                        Mile to Kilometer
                    </option>

                    <option value="centimeter-to-inch">
                        Centimeter to Inch
                    </option>

                    <option value="centimeter-to-foot">
                        Centimeter to Foot
                    </option>

                    <option value="meter-to-yard">
                        Meter to Yard
                    </option>

                    <option value="kilometer-to-mile">
                        Kilometer to Mile
                    </option>
                </select>

                <button type="submit" id="convert-button">
                    Convert
                </button>
            </form>

            <div id="conversion-result" aria-live="polite">
                Your conversion result will appear here.
            </div>
        </section>

        <!-- MAGIC EIGHT BALL -->
        <section class="col" id="magic-eight-ball">

            <h2 class="heading">Magic Eight Ball</h2>

            <form id="eightBallForm">

                <p>
                    Type a yes/no question below, then click
                    on the Eight Ball to get your answer!
                </p>

                <label for="question">Your question:</label>

                <input
                    id="question"
                    name="question"
                    type="text"
                    placeholder="Will I have a good day?"
                >

                <div id="magicEightBall">
                    <div id="circle"></div>

                    <img
                        id="ball"
                        src="img/magic-eight-ball.png"
                        alt="Magic Eight Ball"
                    >
                </div>

                <button id="reset" name="reset" type="reset">
                    Ask another question
                </button>

                <button id="addResponse" type="button">
                    Add a new response
                </button>

            </form>
        </section>

    </main>

    <!-- Load each JavaScript file only once. -->
    <script src="js/task-manager.js" defer></script>
    <script src="metric-converter.js" defer></script>
    <script src="js/magic-eight-ball.js" defer></script>

</body>
</html>
