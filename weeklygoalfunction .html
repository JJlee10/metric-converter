<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interactive Dashboard</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
    }

    .col {
        width: 100%;
        max-width: 500px;
    }

    #weekly-tasks {
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }

    #metric-converter {
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    input,
    select {
        padding: 8px;
        font-size: 16px;
    }

    #goal-btn,
    #convert-button {
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    #goal-message,
    #conversion-result {
        margin-top: 20px;
        font-weight: bold;
    }
</style>
```

</head>

<body>

```
<h1>Dashboard Status</h1>

<div class="row">

    <!-- Weekly Task Goals -->
    <div class="col" id="weekly-tasks">

        <h2>Weekly Task Goals</h2>

        <form id="goal-form">

            <label for="user-name">Name:</label>
            <input type="text" id="user-name" required>

            <label for="daily-goal">Daily Task Goal:</label>
            <input type="number" id="daily-goal" required>

            <label for="bonus-tasks">Weekly Bonus Tasks:</label>
            <input type="number" id="bonus-tasks" required>

            <button type="submit" id="goal-btn">
                Calculate Weekly Goal
            </button>

        </form>

        <p id="goal-message"></p>

        <script src="js/task-manager.js"></script>

    </div>


    <!-- Imperial/Metric Converter -->
    <div class="col" id="metric-converter">

        <h2>Imperial/Metric Converter</h2>

        <form id="converter-form">

            <label for="input-value">Enter a value:</label>

            <input
                type="number"
                id="input-value"
                step="any"
                required
            >

            <label for="conversion-type">
                Choose a conversion:
            </label>

            <select id="conversion-type">

                <option value="inch-to-centimeter">
                    Inch to Centimeter
                </option>

                <option value="foot-to-centimeter">
                    Foot to Centimeter
                </option>

                <option value="yard-to-meter">
                    Yard to Meter
                </option>

                <option value="mile-to-kilometer">
                    Mile to Kilometer
                </option>

                <option value="centimeter-to-inch">
                    Centimeter to Inch
                </option>

                <option value="centimeter-to-foot">
                    Centimeter to Foot
                </option>

                <option value="meter-to-yard">
                    Meter to Yard
                </option>

                <option value="kilometer-to-mile">
                    Kilometer to Mile
                </option>

            </select>

            <button type="submit" id="convert-button">
                Convert
            </button>

        </form>

        <div id="conversion-result">
            Your conversion result will appear here.
        </div>

        <script src="metric-converter.js" defer></script>

    </div>

</div>
```

</body>

</html>
